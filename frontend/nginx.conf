server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy the backends so the browser only ever talks to this origin.
  # Without this the page (:3000) calling :8080/:8081/:8082/:8083 is cross-origin,
  # and none of the Go services emit CORS headers.
  # The trailing slash on proxy_pass strips the location prefix.
  location /payment/ {
    proxy_pass http://payment-service:8080/;
    proxy_set_header Host $host;
  }

  location /notify/ {
    proxy_pass http://notification-service:8081/;
    proxy_set_header Host $host;
  }

  location /amazon/ {
    proxy_pass http://amazon-mock:8082/;
    proxy_set_header Host $host;
  }

  location /udemy/ {
    proxy_pass http://udemy-mock:8083/;
    proxy_set_header Host $host;
  }
}
